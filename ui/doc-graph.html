<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Doc graph · ai-agents-research</title>
  <meta name="description" content="Graph of the ai-agents-research docs and the links between them, filterable by topic hub." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <script>
    document.documentElement.dataset.theme = localStorage.getItem("theme") || "system";
  </script>
  <style>
    body { display: flex; flex-direction: column; height: 100vh; }
    .bar {
      display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--unit) * 2);
      padding: var(--unit) calc(var(--unit) * 2); border-bottom: 1px solid var(--border);
      background: var(--surface); font-size: 0.875rem;
    }
    .bar h1 { font-size: 1rem; margin-right: auto; }
    input { accent-color: var(--primary); } /* brand: no browser-default blue controls */
    .bar #build-info { color: var(--text-muted); font-size: 0.75rem; }
    #search {
      display: block; width: 100%; box-sizing: border-box; margin-bottom: var(--unit);
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 4px 8px; font: inherit;
    }
    #search::-webkit-search-cancel-button { filter: grayscale(1); } /* no blue */
    .stage { flex: 1; display: flex; min-height: 0; }
    /* min-height: 0 lets the canvas shrink with its flex parent; without it the stacked
       phone layout feeds a ResizeObserver loop (vis canvas grows its own container). */
    #graph { flex: 1; min-width: 0; min-height: 0; position: relative; }
    #info {
      width: 300px; flex-shrink: 0; overflow-y: auto; padding: calc(var(--unit) * 2);
      border-left: 1px solid var(--border); font-size: 0.875rem; color: var(--text-muted);
    }
    #info h2 { font-size: 1rem; margin: var(--unit) 0; color: var(--text); }
    #info p { margin: 0 0 var(--unit); }
    #hubs label { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 2px 0; }
    #hubs .all { font-weight: 600; color: var(--text); }
    .legend span { display: inline-flex; align-items: center; gap: 4px; margin-right: var(--unit); }
    .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    @media (max-width: 720px) {
      .stage { flex-direction: column; }
      #info { width: auto; max-height: 35vh; border-left: 0; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div class="bar">
    <h1><a href="index.html">ai-agents-research</a> · doc graph</h1>
    <select id="theme" aria-label="Color theme">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
    <span id="build-info"></span>
  </div>
  <div class="stage">
    <div id="graph" role="img" aria-label="Doc graph"></div>
    <aside id="info">
      <input id="search" type="search" placeholder="Find a doc… (Enter zooms)" aria-label="Find a doc" />
      <p>Dots are docs, diamonds are topic hubs, the star is the hub index, lines are links between them. Click a doc to open it
        on GitHub. Built from the docs on every deploy, without an LLM.</p>
      <p class="legend" id="legend"></p>
      <p id="stats"></p>
      <h2>Topic hubs</h2>
      <div id="hubs"></div>
    </aside>
  </div>
  <script src="vendor/vis-network.min.js"></script>
  <script src="build-info.js" defer></script>
  <script>
    (function () {
      var REPO = "https://github.com/qte77/ai-agents-research/blob/main/";
      var HUB_INDEX = "docs/_topics/README.md";
      // A doc in no hub is split the way check_coverage splits it (plan 0015 N4).
      var FILING = [["unfiled", "Unfiled"], ["exempt", "Exempt by rule"],
                    ["not-hub-content", "Not hub content"]];
      // Top-level folder -> colour token; anything else (root files, plans, learnings) is muted.
      var FOLDERS = [["cc-native", "--primary"], ["non-cc", "--cat-rust"],
                     ["cc-community", "--cat-olive"], ["sdlc-lcm", "--cat-clay"],
                     ["other", "--text-muted"]];
      var sel = document.getElementById("theme");
      sel.value = localStorage.getItem("theme") || "system";

      function token(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }
      function el(tag, text) {
        var e = document.createElement(tag);
        if (text !== undefined) { e.textContent = text; }
        return e;
      }
      function folder(n) {
        var top = n.bucket.split("/")[0];
        return FOLDERS.some(function (f) { return f[0] === top; }) ? top : "other";
      }
      function isHub(n) { return n.bucket === "_topics" && n.id !== HUB_INDEX; }
      function hubLabel(n) { return n.title.replace(/^Topic Hub:\s*/i, ""); }

      fetch("doc-graph.json").then(function (r) {
        if (!r.ok) { throw new Error("HTTP " + r.status); }
        return r.json();
      }).then(render).catch(function (err) {
        var info = document.getElementById("info");
        info.textContent = "";
        info.appendChild(el("h2", "Graph data not available"));
        info.appendChild(el("p", "doc-graph.json could not be loaded (" + err.message +
          "). Run `make graph-data`, then serve ui/ (for example `make preview`)."));
      });

      function render(data) {
        var colour = {};
        FOLDERS.forEach(function (f) { colour[f[0]] = token(f[1]); });
        var dim = token("--border");
        var base = {};
        var nodes = new vis.DataSet(data.nodes.map(function (n) {
          var hub = isHub(n);
          if (n.id === HUB_INDEX) {
            // The hub index lists the hubs; a hollow star keeps it apart from hubs and docs.
            var star = { background: token("--surface"), border: token("--primary") };
            // Reason: an object colour without highlight/hover falls back to vis-network's blue.
            base[n.id] = { background: star.background, border: star.border, highlight: star, hover: star };
            return { id: n.id, title: n.title + "\n" + n.id, color: base[n.id], shape: "star",
                     size: 18, borderWidth: 3, label: "Hub index" };
          }
          base[n.id] = hub ? token("--text") : colour[folder(n)];
          return { id: n.id, title: n.title + "\n" + n.id, color: base[n.id],
                   shape: hub ? "diamond" : "dot", size: hub ? 14 : 8,
                   label: hub ? hubLabel(n) : "" };
        }));
        var edges = new vis.DataSet(data.edges.map(function (e, i) {
          return { id: i, from: e[0], to: e[1] };
        }));

        var legend = document.getElementById("legend");
        FOLDERS.forEach(function (f) {
          var s = el("span"), dot = el("i");
          dot.style.background = colour[f[0]];
          s.appendChild(dot);
          s.appendChild(document.createTextNode(f[0]));
          legend.appendChild(s);
        });
        var count = {};
        data.nodes.forEach(function (n) {
          if (!isHub(n) && !n.hubs.length) { count[n.filing] = (count[n.filing] || 0) + 1; }
        });
        document.getElementById("stats").textContent = data.nodes.length + " docs (" +
          FILING.map(function (f) { return (count[f[0]] || 0) + " " + f[1].toLowerCase(); }).join(", ") +
          "), " + data.edges.length + " linked pairs.";

        // Hub filter: one checkbox per hub, one per kind of doc in no hub, and "Select all".
        var hubs = data.nodes.filter(isHub);
        var checked = {};
        var boxes = [];
        var panel = document.getElementById("hubs");
        function box(key, text, cls) {
          var label = el("label"), input = el("input");
          input.type = "checkbox";
          input.checked = true;
          input.dataset.key = key;
          if (cls) { label.className = cls; }
          label.appendChild(input);
          label.appendChild(document.createTextNode(text));
          panel.appendChild(label);
          return input;
        }
        var all = box("", "Select all", "all");
        hubs.forEach(function (h) { checked[h.id] = true; boxes.push(box(h.id, hubLabel(h))); });
        FILING.forEach(function (f) {
          checked[f[0]] = true;
          boxes.push(box(f[0], f[1] + " (" + (count[f[0]] || 0) + ")"));
        });

        function visible(n) {
          if (isHub(n)) { return checked[n.id]; }
          if (!n.hubs.length) { return checked[n.filing]; }
          return n.hubs.some(function (h) { return checked[h]; });
        }
        function applyFilter() {
          nodes.update(data.nodes.map(function (n) { return { id: n.id, hidden: !visible(n) }; }));
          all.checked = boxes.every(function (b) { return b.checked; });
        }
        panel.addEventListener("change", function (ev) {
          var t = ev.target;
          if (t === all) {
            boxes.forEach(function (b) { b.checked = all.checked; checked[b.dataset.key] = all.checked; });
          } else {
            checked[t.dataset.key] = t.checked;
          }
          applyFilter();
        });

        var network = new vis.Network(document.getElementById("graph"), { nodes: nodes, edges: edges }, {
          physics: { solver: "forceAtlas2Based", stabilization: { iterations: 200 } },
          edges: { color: { color: token("--border"), highlight: token("--primary") }, width: 1, smooth: false },
          nodes: { font: { color: token("--text"), face: "Inter, system-ui, sans-serif", size: 11 } },
          interaction: { hover: true, tooltipDelay: 120 }
        });

        network.on("click", function (params) {
          if (params.nodes.length) {
            window.open(REPO + params.nodes[0], "_blank", "noopener");
          }
        });

        // Live search: dim every doc that doesn't match; Enter zooms to the first visible match.
        var search = document.getElementById("search");
        function matches() {
          var q = search.value.trim().toLowerCase();
          if (!q) { return null; }
          return data.nodes.filter(function (n) {
            return n.id.toLowerCase().indexOf(q) >= 0 || n.title.toLowerCase().indexOf(q) >= 0;
          });
        }
        search.addEventListener("input", function () {
          var hits = matches();
          var hit = {};
          (hits || []).forEach(function (n) { hit[n.id] = true; });
          nodes.update(data.nodes.map(function (n) {
            return { id: n.id, color: !hits || hit[n.id] ? base[n.id] : dim };
          }));
        });
        search.addEventListener("keydown", function (ev) {
          if (ev.key !== "Enter") { return; }
          var top = (matches() || []).filter(visible)[0];
          if (top) {
            network.selectNodes([top.id]);
            network.focus(top.id, { scale: 1.2, animation: true });
          }
        });
      }

      sel.addEventListener("change", function () {
        localStorage.setItem("theme", sel.value);
        document.documentElement.dataset.theme = sel.value;
        location.reload();
      });
    })();
  </script>
</body>
</html>
