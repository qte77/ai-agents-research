---
name: tag-release

# Watches main for pyproject.toml version changes (the squash-merge of a
# bump-my-version release PR) and creates the annotated `v$NEW` tag against the
# actual main commit. Pairs with bump-my-version.yaml, which runs with --no-tag
# so the tag is reachable from main rather than orphaned on the bump branch.
#
# Thin caller of the reusable qte77/.github tag-release workflow. version_regex
# is overridden: pyproject.toml uses `current_version = "..."` (bump-my-version
# convention), not the reusable workflow's `version = "..."` default.

on:
  push:
    branches: [main]
    paths: ['pyproject.toml']

permissions:
  contents: write
  issues: write  # required at workflow startup by reusable notify job (even when unused)

jobs:
  tag:
    uses: qte77/.github/.github/workflows/tag-release.yml@613b950b4045cc099ca23f8b7344459c3dc22cb3  # 2026-09-22
    with:
      version_regex: '^current_version = "(.*)"'
