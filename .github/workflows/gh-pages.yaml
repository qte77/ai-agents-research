name: Deploy GitHub Pages

# Publishes the branded static site in ui/ (landing page + doc graph) via the
# GitHub Pages API — same pattern as the sibling repos analyze-stock-kpi and
# paperverse (no gh-pages branch).
#
# The deterministic doc graph (ui/doc-graph.html) gets its data rebuilt from
# docs/ right here on every deploy.
# Fonts (ui/assets/fonts/) and vis-network (ui/vendor/) are committed, so this
# workflow just assembles ui/ and deploys.
#
# Requires repo Settings -> Pages -> Source = "GitHub Actions".

# Every push to main redeploys (no paths filter), so the version, date and commit
# shown on the site always match main (plan 0015 G2).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Assemble _site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r ui/. _site/

      # Deterministic structural graph (plan 0009 row G): regenerated from docs/ on
      # every deploy — no LLM, stdlib only, never committed, so it cannot drift.
      - name: Build structural doc graph
        run: python3 .github/scripts/build-doc-graph.py --out _site/doc-graph.json

      # Version (pyproject) and deploy commit + date, shown on every page by
      # ui/build-info.js. Uses only the checked-out HEAD commit.
      - name: Build site info
        run: python3 scripts/build-site-info.py --out _site/build.json

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
