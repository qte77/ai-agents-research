---
name: publish-release

# Manual fallback: publish a GitHub Release for an existing tag, with notes
# from the CHANGELOG.md ## [version] block. Normal releases are published
# automatically by release.yaml right after tagging; use this only to backfill
# a tag that has no Release. Fails if the Release already exists.
#
# Thin caller of the reusable qte77/.github publish-release workflow.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (defaults to the latest v* tag)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    uses: qte77/.github/.github/workflows/publish-release.yml@4613389d22779a8d8ba623a418f7c94415e49da9  # main 2026-11-19 (qte77/.github#72)
    with:
      tag: ${{ inputs.tag }}
