---
name: M365 Drift Monitor

# Weekly check of the Microsoft Learn pages cited by the Microsoft 365 Copilot
# doc for `ms.date` changes or vanished quotes, upserting a single
# `m365-drift` tracking issue for a human to triage (#705). Mirrors
# link-rot-monitor's single-issue upsert; the refreshed state file is
# committed via the shared create-triage-pr action (main requires signed
# commits, so a scheduled bot run cannot push to it directly — #572/#573
# learnings).

on:
  schedule:
    - cron: '0 13 * * 1'  # Mon 13:00 UTC — free slot (others run 09/10/11/12)
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m365-drift-monitor
  cancel-in-progress: false

jobs:
  m365-drift:
    name: Check M365 Copilot doc sources + issue upsert
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Run drift check
        id: drift
        run: |
          set +e
          python .github/scripts/m365-drift-monitor.py \
            --state-file .github/state/m365-drift-state.json \
            > /tmp/report.md 2>/tmp/drift-stderr.txt
          EXIT_CODE=$?
          set -e

          cat /tmp/drift-stderr.txt >&2

          echo "changed=$( [ $EXIT_CODE -eq 1 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Upsert m365-drift issue
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ ! -s /tmp/report.md ]; then
            echo "::error::changed=true but the report is empty — treat as a script failure"
            exit 1
          fi

          gh label create m365-drift --color F9A825 \
            --description "Microsoft 365 Copilot doc source drift" --force

          {
            echo "Scheduled check (weekly) of the Microsoft 365 Copilot doc's cited Microsoft Learn pages found drift or a page that could not be checked. Auto-generated; edited in place on each run."
            echo
            echo "**To resolve:** open each linked page, confirm whether the M365 Copilot doc still reflects it, update the doc and its stored quote if needed, then close this issue — a later run reopens it if drift recurs."
            echo
            cat /tmp/report.md
          } > /tmp/issue-body.md

          num="$(gh issue list --state open --label m365-drift --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file /tmp/issue-body.md
            echo "Updated existing issue #$num"
          else
            gh issue create --title "M365 doc drift report" --label m365-drift --body-file /tmp/issue-body.md
          fi

      - name: Commit refreshed state
        if: always()
        uses: ./.github/actions/create-triage-pr
        with:
          branch-prefix: chore/m365-drift-state
          extra-files: .github/state/m365-drift-state.json
          skip-report: 'true'
          pr-title-prefix: 'chore: m365 drift state'
          pr-body-header: 'M365 Drift Monitor State Update'
          pr-body-note: >-
            Auto-generated by m365-drift-monitor. Refreshes the stored ms.date
            values for the watched Microsoft Learn pages (#705). No-ops when
            nothing changed. Until this is merged, each weekly run re-reports
            the same drift against main's stale baseline — by design.
